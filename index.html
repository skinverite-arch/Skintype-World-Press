<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verité Skin Type Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Jost:wght@400;500&display=swap');

  :root{
    --cream:#e5ded2;
    --cream-track:#f0ece4;
    --taupe:#685d54;
    --chocolate:#3b322c;
    --bordeaux:#7a3a3a;
    --white:#faf8f4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--chocolate);
    font-family:'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height:1.55;
    min-height:100vh;
  }
  .top-rule{height:6px;background:var(--bordeaux);width:100%;}
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:900;
    letter-spacing:0.04em;
    text-align:center;
    font-size:28px;
    margin:0 0 6px;
    color:var(--chocolate);
  }
  .kicker{
    text-align:center;
    color:var(--taupe);
    font-size:15px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:36px;
  }
  .card{
    background:var(--white);
    border:1px solid #ddd3c2;
    border-radius:18px;
    padding:36px 32px;
    box-shadow:0 2px 20px rgba(59,50,43,0.06);
  }
  p{margin:0 0 16px; font-size:16px;}
  .lead{font-size:17px;}
  .btn{
    display:inline-block;
    width:100%;
    text-align:center;
    background:var(--taupe);
    color:var(--white);
    border:none;
    border-radius:999px;
    padding:16px 20px;
    font-family:'Jost', sans-serif;
    font-size:16px;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.1s ease;
    margin-top:8px;
  }
  .btn:hover{background:var(--chocolate);}
  .btn:active{transform:scale(0.99);}
  .btn-secondary{
    background:transparent;
    color:var(--taupe);
    border:1.5px solid var(--taupe);
  }
  .btn-secondary:hover{background:var(--cream-track); color:var(--chocolate);}
  .progress-label{
    color:var(--taupe);
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .progress-track{
    background:var(--cream-track);
    border:1px solid #ddd3c2;
    border-radius:999px;
    height:8px;
    overflow:hidden;
    margin-bottom:28px;
  }
  .progress-fill{
    background:var(--taupe);
    height:100%;
    border-radius:999px;
    transition:width 0.35s ease;
  }
  .question-text{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:21px;
    line-height:1.4;
    margin-bottom:24px;
    color:var(--chocolate);
  }
  .answers{display:flex; flex-direction:column; gap:10px;}
  .answer-btn{
    text-align:left;
    background:var(--cream-track);
    border:1.5px solid #ddd3c2;
    border-radius:12px;
    padding:14px 18px;
    font-family:'Jost', sans-serif;
    font-size:15.5px;
    color:var(--chocolate);
    cursor:pointer;
    transition:all 0.15s ease;
  }
  .answer-btn:hover{
    background:var(--taupe);
    color:var(--white);
    border-color:var(--taupe);
  }
  .type-code{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:40px;
    letter-spacing:0.08em;
    text-align:center;
    color:var(--chocolate);
    margin:4px 0 30px;
  }
  .bar-row{margin-bottom:26px;}
  .bar-labels{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--chocolate);
    margin-bottom:8px;
  }
  .bar-track{
    position:relative;
    background:var(--cream-track);
    border:1.5px solid var(--taupe);
    border-radius:999px;
    height:22px;
    overflow:visible;
  }
  .bar-fill{
    background:var(--taupe);
    height:100%;
    border-radius:999px 0 0 999px;
    transition:width 0.6s ease;
  }
  .bar-marker{
    position:absolute;
    top:50%;
    width:18px;
    height:18px;
    background:var(--chocolate);
    border:3px solid var(--white);
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:left 0.6s ease;
  }
  .bar-pct{
    text-align:center;
    font-size:13px;
    color:var(--taupe);
    font-weight:600;
    margin-top:6px;
  }
  .description{font-size:16px; margin-top:8px;}
  .description p{margin-bottom:14px;}
  footer{
    text-align:center;
    margin-top:40px;
    color:var(--taupe);
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:15px;
    letter-spacing:0.03em;
  }
</style>
</head>

w does your skin feel right after a facial treatment (extractions, a peel, massage)?", "a": ["No reaction, all fine", "Mild redness that fades within an hour or two", "Redness lasts until the end of the day", "A strong reaction, needing a day or two to settle"]}, {"q": "Are small blood vessels or visible redness (broken capillaries) noticeable on your face?", "a": ["None at all", "Barely visible in a couple of spots", "Visible on the cheeks or nose", "A noticeable network of visible vessels in several areas"]}, {"q": "How does your skin react to sunscreen?", "a": ["Any formula works fine", "Sometimes I have to be picky about the formula", "Irritation or breakouts often show up", "Almost all of them cause a reaction — I have to seek out special ones"]}, {"q": "Has a new product ever had to be dropped from your routine because of a reaction?", "a": ["Never happened", "Once or twice", "A few times", "This happens fairly regularly"]}, {"q": "How often do you feel itching on your face for no clear reason?", "a": ["Practically never", "Occasionally", "Periodically", "Fairly often"]}, {"q": "Does the skin around your lips ever get irritated by toothpaste or oral care products?", "a": ["Never", "Very rarely", "Sometimes mild irritation shows up", "Fairly often there's irritation around the lips"]}, {"q": "How would you rate your willingness to try new skincare products?", "a": ["I try almost anything without worry", "I choose carefully, but it's usually fine", "I often worry about a reaction and patch-test first", "Very cautious — my skin reacts to new things often"]}], "PN": [{"q": "What usually happens to your skin in the sun without protection, over a short period of time?", "a": ["Almost always just turns red, barely tans", "Sometimes tans a little, sometimes turns red", "Tans fairly easily and evenly", "Tans very quickly and deeply"]}, {"q": "Do you have freckles on your face?", "a": ["None at all", "A few, barely visible", "A noticeable amount, especially in summer", const CATEGORIES = ["OD","SR","PN","WT"];
const QUESTIONS_PER_CATEGORY = 20;

function buildOrder(){
  const order = [];
  for(let i=0;i<QUESTIONS_PER_CATEGORY;i++){
    for(const cat of CATEGORIES){
      order.push({cat, q: QUESTIONS[cat][i]});
    }
  }
  return order;
}
const ORDER = buildOrder();
const TOTAL = ORDER.length;

const AXIS_LABELS = {
  OD: ["Dry","Oily","D","O"],
  SR: ["Resistant","Sensitive","R","S"],
  PN: ["Non-pigmented","Pigmented","N","P"],
  WT: ["Tight","Wrinkle-prone","T","W"],
};

const TRAIT = {
  O: "prone to excess oil and enlarged pores",
  D: "prone to dryness and needs extra hydration",
  S: "sensitive, and reacts quickly to irritants with redness or discomfort",
  R: "resistant to external irritants and tolerates active ingredients well",
  P: "prone to uneven tone and pigmented spots",
  N: "even and stable in tone, with little tendency toward pigmentation",
  W: "inclined toward early expression lines and a gradual loss of firmness",
  T: "holding onto its natural firmness longer, with slower visible signs of aging",
};

const CARE = {
  O: "oil control through light, non-comedogenic textures",
  D: "intensive hydration and barrier repair",
  S: "gentle care without harsh actives, introducing anything new gradually",
  R: "room to experiment with active ingredients without much risk of irritation",
  P: "daily SPF and tone-evening formulas",
  N: "prevention and maintaining your skin's natural tonal balance",
  W: "firmness support and early barrier reinforcement",
  T: "preventive care without overloading the skin",
};

let state = { screen: "welcome", qIndex: 0, scores: {OD:0,SR:0,PN:0,WT:0} };

function resetState(){
  state = { screen: "welcome", qIndex: 0, scores: {OD:0,SR:0,PN:0,WT:0} };
  render();
}

function computeCodeAndPct(scores){
  let code = "";
  const pcts = {};
  for(const cat of CATEGORIES){
    const raw = scores[cat];
    let pct = (raw - QUESTIONS_PER_CATEGORY) / (QUESTIONS_PER_CATEGORY*3) * 100;
    pct = Math.max(0, Math.min(100, pct));
    pcts[cat] = pct;
    const [,, lowLetter, highLetter] = AXIS_LABELS[cat];
    code += pct < 50 ? lowLetter : highLetter;
  }
  return {code, pcts};
}

function buildDescription(code){
  const [od, sr, pn, wt] = code.split("");
  const opening = `Your skin is ${TRAIT[od]}, ${TRAIT[sr]}, ${TRAIT[pn]}, and ${TRAIT[wt]}.`;
  const careLine = `In a daily routine, it's worth focusing on: ${CARE[od]}, ${CARE[sr]}, ${CARE[pn]}, and ${CARE[wt]}.`;
  const closing = "This combination is your skin's current map, not a permanent verdict — it can shift with age, season, or hormonal changes, so it's worth revisiting this test every so often. 🤎";
  return `<p>${opening}</p><p>${careLine}</p><p>${closing}</p>`;
}

function renderWelcome(){
  document.getElementById("kicker").textContent = "Discover your skin, in full";
  return `
    <p class="lead">Welcome to the Verité Skin Type Test ✨</p>
    <p>This isn't just a test to determine your skin type — it's a small journey toward understanding your skin more deeply.</p>
    <p>We'll look at it as a whole: from how it behaves today, to the factors that may be written into your genetics. That's why a few questions will ask not just about you, but about your parents' and grandparents' skin too.</p>
    <p>Ready to learn a little more about your skin? 🤎</p>
    <button class="btn" onclick="goToInstructions()">Continue</button>
  `;
}

function renderInstructions(){
  return `
    <p class="lead">This test has 80 questions and takes about 8–10 minutes.</p>
    <p>Take your time — choose whichever answer describes you and your skin most closely. If you're not sure about a question regarding your family, just choose the closest option.</p>
    <p>Ready? Let's begin ✨</p>
    <button class="btn" onclick="startQuiz()">Let's begin ✨</button>
  `;
}

function renderQuestion(){
  const idx = state.qIndex;
  const {cat, q} = ORDER[idx];
  const pct = Math.round((idx / TOTAL) * 100);
  const answersHtml = q.a.map((text, i) =>
    `<button class="answer-btn" onclick="answer(${idx}, '${cat}', ${i+1})">${text}</button>`
  ).join("");
  document.getElementById("kicker").textContent = `Question ${idx+1} of ${TOTAL}`;
  return `
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="question-text">${q.q}</div>
    <div class="answers">${answersHtml}</div>
  `;
}

function renderResults(){
  const {code, pcts} = computeCodeAndPct(state.scores);
  document.getElementById("kicker").textContent = "Your result";
  let barsHtml = "";
  for(const cat of CATEGORIES){
    const [lowLabel, highLabel] = AXIS_LABELS[cat];
    const pct = pcts[cat];
    barsHtml += `
      <div class="bar-row">
        <div class="bar-labels"><span>${lowLabel}</span><span>${highLabel}</span></div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%"></div>
          <div class="bar-marker" style="left:${pct}%"></div>
        </div>
        <div class="bar-pct">${Math.round(pct)}%</div>
      </div>
    `;
  }
  return `
    <div class="type-code">${code}</div>
    ${barsHtml}
    <div class="description">${buildDescription(code)}</div>
    <button class="btn btn-secondary" onclick="resetState()">Take it again</button>
  `;
}

function render(){
  const app = document.getElementById("app");
  if(state.screen === "welcome") app.innerHTML = renderWelcome();
  else if(state.screen === "instructions") app.innerHTML = renderInstructions();
  else if(state.screen === "quiz") app.innerHTML = renderQuestion();
  else if(state.screen === "results") app.innerHTML = renderResults();
  window.scrollTo({top:0, behavior:"instant"});
}

function goToInstructions(){ state.screen = "instructions"; render(); }
function startQuiz(){ state.screen = "quiz"; state.qIndex = 0; state.scores = {OD:0,SR:0,PN:0,WT:0}; render(); }

function answer(qIndex, cat, points){
  if(qIndex !== state.qIndex) return; // guard against stale clicks
  state.scores[cat] += points;
  state.qIndex += 1;
  if(state.qIndex >= TOTAL){
    state.screen = "results";
  }
  render();
}

render();
</script>
</body>
</html>
